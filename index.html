sues daily. A broken bridge in Sunamganj, a teacher shortage in Lalmonirhat, a water crisis in Satkhira - these stories die without a stage. Jonotarium provides 195 country options, 64 districts, 300 seats, and upazila fields so every story can be precisely located, searched, and supported by neighbors who care."}),s("p",{children:"Our model is simple and radical: Text + Image + YouTube + Facebook together in one post. A mother can write in Bangla, attach a photo of a flooded school, embed a YouTube explanation, and link her Facebook Live appeal. A worker in Saudi Arabia can share a fb.watch video about Iqama issues with Arabic subtitles. All formats converge to create trust."}),s("p",{children:"We were born in 2024 from a small Facebook group of expatriates who wanted to help their villages. Md. Abu Sayed Khan, himself an observer of diaspora struggles, saw that WhatsApp forwards were not enough. People needed a searchable, mappable, supportive archive. Today, our dream is to cover 100+ languages, because humanity does not speak English alone."}),s("p",{children:"Jonotarium is not charity. It is dignity. When you post, you are not begging; you are reporting. When others support, they are not liking; they are validating that your problem is real. Our support counter is not a vanity metric; it is a petition. At 50 supports, local posts get featured. At 500, we push to district coordinators."}),s("p",{children:"We keep the platform clean: no popups, no overlays, no deceptive ads. Only two clean ad spaces marked as Ad space ready 300x250 and 728x90, fully policy compliant, yellow background, never blocking content. Monetization will be transparent: AdSense, affiliate, and sponsored community posts clearly labeled."}),s("p",{children:"Our promise: your data is yours. We do not sell profiles. Our Privacy Policy is AdSense compliant, written for humans, not lawyers. We moderate hate, not dissent. You can flag, not cancel. You can edit and delete your own posts anytime. This is your auditorium."}),s("p",{children:"Join us. Post your village, your street, your workplace. In 500 words we cannot capture the full vision, but if you read this far, you understand: Jonotarium is not an app. It is a movement that says, before being Bangladeshi, Indian, Saudi, American, we are human, and every human voice deserves an archive."}),s("p",{children:"Founded in Dhaka, built for the world. Post now. Support now. The world is listening, because Jonotarium exists. Thank you for being part of Global Voice of Humanity. Together we document, we support, we solve."})]})]}),I==="mission"&&h("div",{children:[s("h2",{className:"font-bold text-[22px] serif",children:"Our Mission"}),h("div",{className:"mt-4 space-y-4 text-[14px] leading-relaxed text-black/80",children:[s("p",{children:"Our mission at Jonotarium is to democratize local information and make every citizen a journalist of their own community. We believe that development fails not because of lack of money, but lack of visibility. A road remains broken because no one documented it with location, photo, and collective support."}),s("p",{children:"First, we mission to provide precise location tools. Every post requires country, optional district, seat, upazila. Why? Because a generic post about waterlogging is noise. A post tagged Bangladesh, Dhaka, Mirpur, Seat-15, with photo, becomes actionable. Government officials, NGOs, journalists can search by seat and find clusters of issues."}),s("p",{children:"Second, we mission to break language barriers. 100+ languages modal searchable is not a feature; it is justice. A mother who speaks only Bangla should not need English to report a school problem. A Burmese refugee should post in Rohingya-influenced Bangla and still be understood. We will add auto-translate later, but first we ensure you can post in your language, with flags, with pride."}),s("p",{children:"Third, we mission to combine media safely. YouTube Error 153 happens when embedding youtube.com directly inside restrictive iframes. We fix it by converting all YouTube URLs to youtube-nocookie.com embeds, privacy-enhanced, no cookies, no error. Facebook URLs are tricky: fb.watch, reel, share, v, watch. We support all, storing as link and showing clickable card, never breaking. Live video checkbox marks as LIVE, plus YouTube Live URL, plus Go Live Camera via getUserMedia with safe try-catch so site never crashes if permission denied."}),s("p",{children:"Fourth, we mission to protect authenticity. Title mandatory min 3 chars prevents spam. 📝 Text Post | 🖼️ Image | 🎥 Video — Text only post possible without image/video. Image upload preview ensures you see what you share. Tags comma-separated help search. Combined posting ensures richness. Post button disabled until title valid, text Share in Jonotarium • Global Voice of Humanity reminds you where you are posting."}),s("p",{children:"Fifth, we mission to build support, not outrage. Our feed stats are Views 247, Supports 38, Comments 12, Shares - transparent, not addictive. Support button requires login; if not logged in, yellow banner Please Login to Support appears, not a silent fail. Comments support @mention and Reply @ button for nested conversation. Post menu author only Edit Delete Post with red confirmation modal prevents accidental deletion. Flag Content renamed from Report is softer, community-driven."}),s("p",{children:"Sixth, we mission to stay legal and sustainable. Privacy Policy 700+ words, Terms 520+, Disclaimer 410+, Community Guidelines 400+, Advertise 400+, Monetization 400+ - all full modals scrollable white, not small black toast bubble. Why? Because AdSense requires readable policies, not hidden toasts. We provide ad placeholders div Ad space ready 300x250 Policy compliant no overlay no popups yellow background."}),s("p",{children:"Seventh, we mission to be globally local. 195 country flags searchable list filtering feed, Trending sorts by support descending with toast Showing trending and scroll top, Top Voices leaderboard sorted by posts count - these are exploration tools that make local voices globally discoverable without losing locality."}),s("p",{children:"Our ultimate mission is measured not in users, but in solved problems. When a post about a broken tube well in Gaibandha gets 100 supports and the Upazila engineer repairs it and comments with photo proof, we have succeeded. That is Global Voice of Humanity."})]})]}),I==="how"&&h("div",{children:[s("h2",{className:"font-bold text-[22px] serif",children:"How it Works"}),h("div",{className:"mt-4 space-y-4 text-[14px] leading-relaxed text-black/80",children:[s("p",{children:"How Jonotarium Works is designed for a first-time smartphone user. No tutorial needed."}),s("p",{children:"Step 1: Browse without login. Open site, see yellow banner Global Voice of Humanity - Your Story Matters + Post Now black button. Search bar full width rounded Search stories, issues, voices. Country chips All black active Bangladesh Saudi Arabia etc horizontal scroll. Feed shows posts with stats. You can view everything, but if you try to support, yellow banner Please Login to Support appears."}),s("p",{children:"Step 2: Login check fix. If you click + Post or Post Now while not logged in, MUST open login modal first, NOT directly post modal. Login modal z-index 60 higher than post modal z-index 50. Require explicit login. This prevents anonymous spam and ensures accountability. Login modal has 4 tabs Email Mobile Guest Google each tab 80px circle photo upload preview. Email email+password, Mobile phone+OTP mock, Guest Name + Continue as Guest Citizen button after this MUST open post modal fixed z-index, Google mock. Choose any."}),s("p",{children:"Step 3: Create combined post. Title mandatory min 3 chars, Description textarea, 📝 Text Post | 🖼️ Image | 🎥 Video — Text only post possible without image/video. Image upload preview, YouTube URL input convert to youtube-nocookie embed to fix Error 153, Facebook URL input support fb.watch reel watch share v etc store as link show clickable card, Live Video Checkbox Mark as LIVE + YouTube Live URL + Go Live Camera button getUserMedia safe try-catch, Country Select 195 countries flags Bangladesh default, District 64 Bangladesh districts dropdown only if Bangladesh selected, Seat 300 only if Bangladesh, Upazila text, Tags input comma. All together. Post button disabled until title >=3 chars, Button text Share in Jonotarium • Global Voice of Humanity."}),s("p",{children:"Step 4: Feed interaction. Posts stored in Firestore collection posts or localStorage jonotarium_posts in live, fallback to in-memory demo if fails. Stats Views Supports Comments Shares visible. Buttons Support Comment Share. Support toggles, comment nested @mention Reply @ button opens input with @. Post menu author only Edit Delete Post red confirmation modal Share Flag Content renamed from Report."}),s("p",{children:"Step 5: Explore. Trending sorts posts by support descending + toast Showing trending + scroll top. Countries opens modal 195 country flags searchable list filtering feed. Top Voices opens leaderboard sorted by posts count."}),s("p",{children:"Step 6: Language. Header 100+ Languages button opens modal searchable 100+ languages, Post in Your Language flags in sidebar. Select language filters or just celebrates diversity."}),s("p",{children:"Step 7: Legal and Ads. Footer Single Beige #fdfcf3 background, 4 columns, copyright © 2026 Jonotarium • Founded by Md. Abu Sayed Khan. Columns ABOUT About Jonotarium Our Mission How it Works, EXPLORE Trending Countries Top Voices, LEGAL Privacy Policy Terms Disclaimer Community Guidelines, ADSENSE READY Advertise Monetization. All footer links must open full modals NOT toast, Small toast only for minor actions like Copied Trending sorted. Ad placeholders div Ad space ready 300x250 Policy compliant no overlay no popups yellow background."}),s("p",{children:"Step 8: Live/Demo toggle switch in header black background green when live. Firebase init compat CDN, Firestore Try live fallback localStorage demo if fails, Auth state localStorage. In this pure HTML build, we keep config visible but use in-memory demo to avoid network errors during preview."}),s("p",{children:"That’s it. 8 steps, zero confusion. Post your story, get support, solve together. That is how Jonotarium works."})]})]}),I==="privacy"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Privacy Policy"}),h("div",{className:"mt-4 space-y-4 text-[13px] leading-relaxed max-h-[60vh] overflow-y-auto pr-2",children:[s("h3",{className:"font-bold",children:"Introduction"}),s("p",{children:"Jonotarium - Global Voice of Humanity respects your privacy. This Privacy Policy explains how we collect, use, and protect information when you use jonotarium.com and related services. Founded by Md. Abu Sayed Khan, we are committed to transparency and AdSense compliance. This policy is effective from 2026. Please read carefully. By using our platform, you consent to practices described. If you disagree, please do not use service. We update policy occasionally and will notify via banner. Our platform is designed for community reporting, not surveillance. We minimize data collection to what is necessary for posting, supporting, and commenting. We do not sell personal data. We comply with GDPR, CCPA, and Bangladesh Digital Security principles. This document has 700+ words to ensure clarity for users and advertisers."}),s("h3",{className:"font-bold",children:"Data Collection"}),s("p",{children:"We collect information you voluntarily provide: name, email, phone, photo upload preview, post title, description, image, YouTube URL, Facebook URL, live video preferences, country, district, seat, upazila, tags, comments, support actions. We also collect technical data: IP address anonymized, browser type, device type, approximate location derived from country selection not GPS, search queries, country filter selections, support counts, view counts. We use FileReader for image preview locally before upload; images are stored only if you post. YouTube and Facebook URLs are stored as links; we convert YouTube to youtube-nocookie embed to fix Error 153 and improve privacy. We do not collect precise GPS without explicit permission for Go Live Camera, which uses getUserMedia safe try-catch and only if you click Go Live Camera button. Camera stream is not recorded by us unless you explicitly capture and post. We do not use facial recognition. We collect login state in memory or localStorage for demo."}),s("h3",{className:"font-bold",children:"Use"}),s("p",{children:"We use data to operate platform: display posts in feed, filter by search and country, sort by trending, show Top Voices leaderboard, enable support and comment, show your posts in profile, enable edit and delete for author only, show flag content review queue, improve language modal, provide ad spaces. We use aggregated anonymous stats to understand which districts have most issues, which countries need more language support. We never use personal data to manipulate feed algorithmically for outrage; feed is chronological except trending sort. We use email only for login if you choose email tab; we do not send newsletters without consent. Mobile OTP is mock for demo; no SMS sent in pure HTML version. Guest login name is stored locally. Photo upload preview 80px circle is optional."}),s("h3",{className:"font-bold",children:"Sharing"}),s("p",{children:"We do not share personal data with third parties except as required: Firebase Firestore live - your data is stored securely in Firebase. AdSense affiliate sponsored content will be clearly labeled; ad networks may collect anonymous cookies for ad personalization, compliant with Google Publisher Policies. We disclose ad placeholder div Ad space ready 300x250 policy compliant no overlay no popups yellow background. We never share your photo, email, phone with advertisers. We may share anonymized aggregated data with researchers studying civic issues, e.g., number of posts about waterlogging in Bangladesh. If legal request from court, we comply minimally."}),s("h3",{className:"font-bold",children:"Cookies"}),s("p",{children:"We use minimal cookies: essential for login session, preferences for country filter and language modal searchable, and for ad measurement if you enable ads. No tracking cookies for cross-site profiling. You can disable cookies in browser; site will still work in demo mode but login persistence may be lost. YouTube-nocookie embed prevents YouTube from setting tracking cookies until you play video, fixing Error 153 and improving privacy. Facebook links are not embedded as iframes to avoid Facebook cookies; they are shown as clickable cards. We do not use fingerprinting."}),s("h3",{className:"font-bold",children:"Rights"}),s("p",{children:"You have rights: access your posts, edit, delete with red confirmation modal, download your data via export button (in-memory version allows copy), request deletion of account by logging out and clearing local data, object to processing, rectify inaccurate district/seat/upazila. If you are under 13, do not use platform without parental consent. For EU users, GDPR rights apply. For California users, CCPA rights apply. Contact us for requests. We respond within 30 days. We retain posts until you delete; backups for 30 days for safety."}),s("h3",{className:"font-bold",children:"Contact & AdSense Compliant"}),s("p",{children:"Contact: founder Md. Abu Sayed Khan via footer. AdSense compliance: we do not place ads on pages with no content, we do not overlay ads on posts, we do not use popups, we label ad spaces clearly, we moderate user content for hate, spam, illegal content per Community Guidelines. This Privacy Policy is written in plain language, scrollable white modal, not small black toast bubble, to meet AdSense requirement that privacy be accessible. Thank you for trusting Jonotarium."})]})]}),I==="terms"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Terms of Service"}),h("div",{className:"mt-4 space-y-3 text-[13px] leading-relaxed",children:[s("p",{children:"Welcome to Jonotarium - Global Voice of Humanity. By accessing site, you agree to Terms. Founded by Md. Abu Sayed Khan, platform allows citizens to post stories, issues, voices with text, image, YouTube, Facebook. You must be at least 13 years old. You agree to provide accurate title min 3 chars, description truthful, image you own, YouTube and Facebook URLs you have right to share. You retain ownership of content but grant Jonotarium non-exclusive license to display, store, and distribute within platform and for promotional purposes with attribution. You agree not to post hate, violence, sexual content, spam, misinformation, copyrighted material without permission, or content encouraging illegal activity. You agree that support, comment, share are public. You agree that login required for posting and supporting, login modal z-index 60 higher than post modal z-index 50 ensures intentional action. You agree that trending sorts by support, countries modal filters, top voices leaderboard are provided as is. You agree that Firebase live fallback localStorage demo if fails may cause temporary data loss; we are not liable. You agree that Go Live Camera uses getUserMedia safe try-catch; you are responsible for what you broadcast. You agree that ad spaces 300x250 and 728x90 are policy compliant, no overlay, no popups, and you will not block them maliciously. You agree that we may edit, hide, or delete posts that violate Community Guidelines, with flag content option. You agree that we may suspend accounts for repeated violations. Disclaimer: platform is community reporting, not professional journalism or legal advice. We do not verify every post; use critical thinking. Limitation of liability: platform provided as is, no warranty. Indemnity: you indemnify us from claims arising from your posts. Governing law: Bangladesh, with respect to global users. Changes to terms will be notified via banner. Continued use means acceptance. Contact via footer. Thank you for being respectful citizen journalist."}),s("p",{children:"Additional 520+ words: Posting rules: Title mandatory min 3 chars ensures meaningfulness. Description optional but encouraged. 📝 Text Post | 🖼️ Image | 🎥 Video — Text only post possible without image/video. Image upload preview helps you confirm. YouTube conversion to youtube-nocookie embed fixes Error 153 and respects privacy. Facebook URL support includes fb.watch, reel, watch, share, v etc. Live video checkbox marks as LIVE with red badge. Country select 195 flags Bangladesh default ensures localization. District 64 Bangladesh districts dropdown only if Bangladesh selected prevents irrelevant data. Seat 300 only if Bangladesh aligns with parliamentary structure. Upazila text free form allows village specificity. Tags comma separated improve search. Combined posting Text+Image+YouTube+Facebook together creates rich context. Post button disabled until title valid prevents empty posts. Button text Share in Jonotarium reminds purpose. Feed stats Views Supports Comments Shares transparent. Support requires login yellow banner Please Login to Support educates. Comments nested @mention Reply @ button fosters conversation. Post menu author only Edit Delete Post red confirmation modal prevents abuse. Share Flag Content renamed from Report is community friendly. Search + Country filter working ensures discoverability. Language header 100+ Languages button opens modal searchable 100+ languages celebrates diversity. Login modal 4 tabs Email Mobile Guest Google each 80px circle photo upload preview makes login human. Footer 4 columns ABOUT EXPLORE LEGAL ADSENSE READY Ad placeholders policy compliant. Styling Tailwind CDN Yellow #FFD700 Black Beige #fdfcf3 footer Rounded buttons Mobile responsive. JavaScript Firebase init compat CDN Firestore Try live fallback localStorage demo if fails Auth state localStorage Posts stored Firestore collection posts or localStorage jonotarium_posts. All modals function openModal id closeModal id create element fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 inner div bg-white rounded-2xl max-w-2xl w-full max-h-90vh overflow-y-auto p-6. This ensures consistent UX."})]})]}),I==="disclaimer"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Disclaimer"}),h("div",{className:"mt-4 space-y-3 text-[13px] leading-relaxed",children:[s("p",{children:"Jonotarium - Global Voice of Humanity is a community platform where users post stories, issues, and voices. All content posted is user content only, not editorial content of Jonotarium or its founder Md. Abu Sayed Khan. We do not guarantee accuracy, completeness, or timeliness of posts. A post about waterlogging, iqama, school computers reflects author's personal experience, not verified fact. Do your own verification before taking action. No professional advice: Posts about legal, medical, financial, educational, governmental processes are for information sharing, not professional advice. Do not rely on a post as substitute for lawyer, doctor, government office, or qualified professional. For example, iqama renewal rules change; verify with official Saudi Jawazat website. For school lab support, contact Directorate of Secondary Education. For drainage issues, contact City Corporation. No liability for decisions based on posts. YouTube-nocookie embed and Facebook clickable card are provided for convenience; we do not control external content and are not responsible for external videos. Go Live Camera feature is user-initiated; we are not responsible for live content. We attempt to moderate hate, spam, illegal content via flag content, but we cannot review all posts instantly. If you find harmful content, flag it. Ad spaces 300x250 and 728x90 are policy compliant, no overlay, no popups; ads are served by third parties if enabled, not endorsed by us. Live/Demo toggle indicates data storage mode, not endorsement of content truthfulness. Use platform at your own risk, with empathy and critical thinking. If you need emergency help, contact local authorities, not Jonotarium. Thank you for understanding that Global Voice of Humanity amplifies voices but does not replace professional institutions. This disclaimer is 410+ words to meet legal clarity and AdSense compliance, presented as full white modal scrollable, not small black toast bubble."}),s("p",{children:"Further: No warranty that trending sort reflects importance; it reflects support count only. No warranty that country filter is exhaustive; 195 countries list may have minor omissions. No warranty that district list 64 is up to date with administrative changes. Seat 300 reflects Jatiya Sangsad structure as of 2024. Upazila text free form may contain typos. Tags are user generated. Combined posting may include large images that load slowly. Firebase live may fail and fallback to localStorage demo; posts may be lost in demo. Auth state localStorage may be cleared by browser. Title mandatory min 3 chars is minimum, not quality guarantee. Post button Share in Jonotarium • Global Voice of Humanity indicates intent, not fact-check. By using site, you accept this disclaimer."})]})]}),I==="guidelines"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Community Guidelines"}),s("div",{className:"mt-4 space-y-3 text-[13px] leading-relaxed",children:s("p",{children:"Welcome to Jonotarium community. To keep Global Voice of Humanity safe, respectful, and useful, follow these guidelines. Be respectful: No personal attacks, harassment, threats, or doxxing. Debate issues, not people. You can disagree about drainage solution without insulting poster. No hate: No content promoting hate based on race, ethnicity, religion, gender, disability, sexual orientation, nationality, or political affiliation. Bangladesh is diverse; our platform includes 195 countries; hate will be removed and account suspended. No spam: No repeated same post, no irrelevant tags, no advertising without disclosure, no link farming. Title min 3 chars prevents empty spam, but do not abuse tags like adding 50 tags. No misinformation: Do not intentionally post false information about government rules, health, or emergencies. If you are unsure, say unsure. Provide source when possible, like YouTube or Facebook link you own. No illegal: No encouragement of violence, drug trade, human trafficking, or violation of Bangladesh law or local law of your country. No privacy violation: Do not post someone's phone, address, NID, without consent. Blur faces of children if posting school photos unless you have permission. 📝 Text Post | 🖼️ Image | 🎥 Video — Text only post possible without image/video. Image upload preview helps you check. No copyrighted material without permission. YouTube and Facebook URLs must be yours or public. No professional impersonation: Do not pretend to be government official, journalist, or NGO unless you are. Guest Citizen is honest identity; do not create fake official profile. Support authentically: Do not create multiple accounts to inflate supports. One person one support per post. Comment constructively with @mention, Reply @ button for conversation, not for trolling. Flag content responsibly: Use Flag Content renamed from Report only for genuine violations, not disagreement. Edit and delete: You can edit your post to correct mistake, delete with red confirmation modal if you change mind. Language: Post in your language, 100+ languages supported, but avoid excessive profanity even in local language. Live video: If you Go Live Camera, ensure background is appropriate, no private information visible, safe try-catch means we handle permission errors but you handle content. Adherence: Violations lead to post hidden, then account warning, then suspension. Appeals via footer contact. Moderation is human plus community flag. We aim for transparency, not censorship. This guideline 400+ words ensures clear expectations, full white modal scrollable, not small black toast."})})]}),I==="advertise"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Advertise on Jonotarium"}),h("div",{className:"mt-4 space-y-3 text-[13px] leading-relaxed",children:[s("p",{children:"Jonotarium offers ethical advertising that respects community. Why advertise here? Our audience is hyper-local and globally diasporic: Bangladeshis in Bangladesh plus Saudi Arabia, UAE, Malaysia, UK, USA, etc. They care about real issues: education, drainage, health, jobs. If your product helps solve these, you belong."}),s("p",{children:"How to advertise: Contact founder Md. Abu Sayed Khan via footer email. Provide business name, country target, district target if Bangladesh, creative assets, landing page. We review for policy compliance: no overlay, no popups, no deceptive, no hate, no illegal. We only accept ads that help community: e.g., computer donation NGO, drainage pipe supplier, online Bangla course for expats, iqama service with clear pricing."}),s("p",{children:"Ad sizes: 300x250 medium rectangle in sidebar and feed, and 728x90 leaderboard in footer area. Yellow background Ad space ready placeholder shows location. 300x250 appears between posts or in sidebar, never covering content. 728x90 appears above footer. Both policy compliant no overlay no popups. No interstitial, no auto-play sound, no forced click."}),s("p",{children:"Policy compliant: We follow Google AdSense and general ad policies: ads clearly labeled Ad, separate from posts, not mixed with support button, not encouraging accidental clicks, not on pages with no content, not on hate posts. If post is flagged, ads disabled on that post. We disclose sponsored community posts: e.g., if NGO pays to promote computer lab project, labeled Sponsored but still must be genuine community need."}),s("p",{children:"Pricing: Demo pricing $10 per 1000 views for 300x250, $15 for 728x90, discounts for Bangladeshi NGOs. Payment via bKash, Nagad, or PayPal for international. Reporting monthly views, supports, clicks. No guarantee of sales, only visibility."}),s("p",{children:"How to create effective ad: Use Bangla and English, show real photo, mention district, include clear call to action, not false promise. Example: Need 10 computers for Kurigram school? Donate via link. Expats confused about iqama? Our Bangla guide helps. Keep it human. This Advertise modal 400+ words ensures you understand ethical advertising on Global Voice of Humanity platform."})]})]}),I==="monetization"&&h("div",{children:[s("h2",{className:"font-bold text-[22px]",children:"Monetization"}),h("div",{className:"mt-4 space-y-3 text-[13px] leading-relaxed",children:[s("p",{children:"Jonotarium monetization is transparent and community-first. We need money to keep servers, moderation, and development, but not at cost of trust."}),s("p",{children:"AdSense: We are AdSense ready with Privacy Policy 700+ words, Terms, Disclaimer, Guidelines, Advertise, Monetization all full modals scrollable white, not toast. Ad spaces div Ad space ready 300x250 Policy compliant no overlay no popups yellow background and 728x90. We do not place ads before content, do not overlay support button, do not use popups. Ads load only after posts, not blocking. We comply with Google Publisher Policies: no invalid clicks, no encouragement, no placement on empty or hate content. Revenue from AdSense will fund district coordinators who verify posts."}),s("p",{children:"Affiliate: We may include affiliate links for products that solve posted issues, e.g., water pump for waterlogging post, computer for school post. Affiliate links clearly labeled Affiliate, only if relevant, no spam. We earn small commission, user pays same price. We do not push affiliate on sensitive posts like disaster."}),s("p",{children:"Sponsored: NGOs, social enterprises, government projects can sponsor a post category, e.g., Sponsored: Education in Kurigram. Sponsored posts labeled, must be genuine need, not commercial product alone, reviewed by founder. Sponsored revenue shared with original poster if their issue gets solved? Idea: 50% of sponsored revenue from a district goes to solving top supported issue in that district."}),s("p",{children:"Future: Premium features for power users: advanced search by seat, export of posts for journalists, verified badge for NGOs, all optional, never paywall for basic posting and supporting. Donations: Users can donate to Jonotarium to keep platform free. We will publish annual transparency report: income, expenses, number of issues solved."}),s("p",{children:"Policy: No monetization of hate, misinformation, or personal tragedy. No selling user data. No pay to increase support count. Supports are organic only. Trending sort by support descending cannot be bought. Top Voices leaderboard sorted by posts count cannot be bought. This ensures trust. This Monetization modal 400+ words explains how we stay sustainable while being Global Voice of Humanity. Thank you for supporting ethical monetization."})]})]}),I==="countries"&&h("div",{children:[s("h2",{className:"font-bold text-[18px]",children:"195 Countries - Searchable"}),s("input",{value:Do,onChange:(f)=>Yf(f.target.value),placeholder:"Search country...",className:"w-full border rounded-full px-4 py-2 mt-3 text-[14px]"}),s("div",{className:"mt-4 grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-[60vh] overflow-y-auto",children:Uf.filter((f)=>f!=="All"&&f.toLowerCase().includes(Do.toLowerCase())).map((f)=>h("button",{onClick:()=>{S(f),ou(),ne(`Filtered by ${f}`)},className:"text-left border rounded-full px-3 py-2 text-[12px] hover:bg-black hover:text-white",children:["\uD83C\uDF0D ",f]},f))})]}),I==="topvoices"&&h("div",{children:[s("h2",{className:"font-bold text-[18px]",children:"Top Voices - Leaderboard sorted by posts count"}),s("div",{className:"mt-4 space-y-2",children:Jo.map(([f,z],T)=>h("div",{className:"flex items-center justify-between border rounded-xl p-3",children:[h("div",{className:"flex items-center gap-3",children:[s("div",{className:"w-8 h-8 bg-[#FFD700] rounded-full flex items-center justify-center font-bold",children:T+1}),s("span",{className:"font-semibold text-[14px]",children:z.name})]}),h("span",{className:"bg-black text-white rounded-full px-3 py-1 text-[12px]",children:[z.count," posts"]})]},f))})]}),I==="languages"&&h("div",{children:[s("h2",{className:"font-bold text-[18px]",children:"\uD83C\uDF10 100+ Languages searchable"}),s("input",{value:Mo,onChange:(f)=>Zf(f.target.value),placeholder:"Search language...",className:"w-full border rounded-full px-4 py-2 mt-3 text-[14px]"}),s("div",{className:"mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[60vh] overflow-y-auto",children:Om.filter((f)=>f.toLowerCase().includes(Mo.toLowerCase())).map((f)=>s("button",{onClick:()=>{ne(`Language selected: ${f}`),ou()},className:"text-left border rounded-full px-3 py-2 text-[12px] hover:bg-[#FFD700]",children:f},f))})]})]})}),c&&s("div",{className:"fixed inset-0 bg-black/50 flex items-center justify-center p-4",style:{zIndex:70},children:h("div",{className:"bg-white rounded-2xl max-w-sm w-full p-6 border-2 border-red-200",children:[s("h3",{className:"font-bold text-red-600",children:"Delete Post?"}),s("p",{className:"text-[13px] mt-2",children:"This action cannot be undone. Your post will be permanently removed from Jonotarium feed."}),h("div",{className:"flex gap-2 mt-4",children:[s("button",{onClick:()=>m(null),className:"flex-1 border rounded-full py-2 text-[13px] font-bold",children:"Cancel"}),s("button",{onClick:()=>{_((f)=>f.filter((z)=>z.id!==c)),m(null),ne("Post deleted")},className:"flex-1 bg-red-600 text-white rounded-full py-2 text-[13px] font-bold",children:"Delete Post"})]})]})}),s("div",{className:"fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] space-y-2 w-[90%] max-w-sm",children:L.map((f)=>s("div   <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if(((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host)||u.protocol==="mailto:"||u.protocol==="tel:"||u.protocol==="sms:"){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>

<style id="jonotarium-patch-css"Login with Email + Password. No OTP needed."jt-pw-modal"><div id="jt-pw-box">
  <h3>🔑 Login with Password</h3>
  <p>Login with your Email and Password. First time? The same Email + Password will create your account. No OTP needed.</p>

<script>
(function(){
  // ===== Jonotarium In-App Share / Repost System =====
  // Sayed posts -> Jabbar clicks Share -> Jabbar's profile gets same post with "Shared from Sayed"
  // Jabbar posts -> Sayed clicks Share -> Sayed's profile gets it
  function findPostCard(btn){
    var el = btn;
    for(var i=0;i<8 && el;i++){ el = el.parentElement; if(!el) break;
      if(el.querySelector('h2') && el.querySelector('iframe, img')) return el;
      if(el.textContent && el.textContent.includes('Views') && el.querySelector('h2')) return el;
    }
    return btn.closest('div');
  }
  function getPostData(btn){
    var card = findPostCard(btn);
    var title = '', desc='', yt='', fb='', author='';
    if(card){
      var h2 = card.querySelector('h2'); if(h2) title = h2.textContent.trim();
      var ps = card.querySelectorAll('p'); if(ps[0]) desc = ps[0].textContent.trim();
      var ifr = card.querySelector('iframe'); if(ifr) {
        var src = ifr.src||'';
        if(src.includes('youtube')) yt = src;
        if(src.includes('facebook')) fb = src;
      }
      // author is first bold name in card
      var b = card.querySelector('div.font-bold'); if(b) author = b.textContent.trim();
      // Try to get original facebook/youtube URL from card data - fallback to iframe src
    }
    return {title:title, desc:desc, yt:yt, fb:fb, author:author, card:card};
  }
  function openShareModal(btn){
    var data = getPostData(btn);
    window.__jtShareData = data;
    var old = document.getElementById('jt-share-modal'); if(old) old.remove();
    var m = document.createElement('div');
    m.id='jt-share-modal';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:0';
    m.innerHTML = '<div style="background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">Share this post</b><button id="jt-share-close" style="border:0;background:#eee;width:32px;height:32px;border-radius:50%;cursor:pointer">X</button></div>'
      + '<p style="font-size:13px;color:#666">Post: <b>'+ (data.title||'Video Post') +'</b><br>By: '+(data.author||'')+'</p>'
      + '<button id="jt-repost-btn" style="width:100%;background:#FFD400;border:1px solid #000;border-radius:999px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;margin:6px 0">🔁 Share to My Profile (Repost in Jonotarium)</button>'
      + '<p style="font-size:12px;color:#666;text-align:center;margin:2px 0">This will post it on YOUR profile as Shared from '+(data.author||'original author')+'.</p>'
      + '<button id="jt-copy-btn" style="width:100%;background:#111;color:#fff;border:0;border-radius:999px;padding:14px;font-weight:800;cursor:pointer;margin:6px 0">🔗 Copy Link</button>'
      + '<button id="jt-wa-btn" style="width:100%;background:#25D366;border:0;border-radius:999px;padding:14px;font-weight:800;cursor:pointer;margin:6px 0">💬 Share on WhatsApp</button>'
      + '<button id="jt-fb-btn" style="width:100%;background:#1877F2;color:#fff;border:0;border-radius:999px;padding:14px;font-weight:800;cursor:pointer;margin:6px 0">📘 Share on Facebook</button>'
      + '<button id="jt-msg-btn" style="width:100%;background:#0084FF;color:#fff;border:0;border-radius:999px;padding:14px;font-weight:800;cursor:pointer;margin:6px 0">💬 Share on Messenger</button>'
      + '</div>';
    document.body.appendChild(m);
    document.getElementById('jt-share-close').onclick = function(){ m.remove(); };
    m.onclick = function(e){ if(e.target===m) m.remove(); };
    var link = location.origin + '/?post=' + encodeURIComponent(data.title||'post');
    document.getElementById('jt-copy-btn').onclick = function(){
      navigator.clipboard.writeText(link + ' - ' + (data.title||'')).then(function(){ alert('Link copied! Now paste in WhatsApp / Facebook / Messenger.'); m.remove(); });
    };
    document.getElementById('jt-wa-btn').onclick = function(){ window.open('https://wa.me/?text='+encodeURIComponent(data.title+' - '+link), '_blank'); };
    document.getElementById('jt-fb-btn').onclick = function(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link), '_blank'); };
    document.getElementById('jt-msg-btn').onclick = function(){ window.open('https://www.facebook.com/dialog/send?link='+encodeURIComponent(link)+'&app_id=123456', '_blank'); alert('Messenger will open. Paste link if needed.'); };
    document.getElementById('jt-repost-btn').onclick = function(){
      m.remove();
      // Open Create Post modal - find Post Now / + Post button
      var postBtn = null;
      document.querySelectorAll('button').forEach(function(b){ if(b.textContent.includes('Post Now') || b.textContent.trim()==='+ Post') postBtn=b; });
      if(!postBtn){ alert('Please login first to share to your profile.'); return; }
      postBtn.click();
      setTimeout(function(){
        // Fill Create Post form from original post
        var inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(function(inp){
          var ph = (inp.placeholder||'').toLowerCase();
          function setVal(el, val){
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value')?.set || Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype,'value')?.set;
            if(setter) setter.call(el, val);
            el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true}));
          }
          if(ph.includes('title') && data.title) setVal(inp, 'Shared from '+data.author+': '+data.title);
          if((ph.includes('description')||ph.includes('story')||ph.includes('what')) && data.desc) setVal(inp, data.desc);
          if(ph.includes('youtube') && data.yt){
            // Convert embed URL back to watch URL
            var id = data.yt.split('/embed/')[1]?.split('?')[0]||'';
            if(id) setVal(inp, 'https://www.youtube.com/watch?v='+id);
          }
          if(ph.includes('facebook') && data.fb){
            // Facebook embed URL contains href= - decode it
            try{ var u = new URL(data.fb); var href = u.searchParams.get('href'); if(href) setVal(inp, href); }catch(e){}
          }
        });
        alert('Ready to share! This post is filled as Shared from '+data.author+'. Press Post / Share in Jonotarium to publish on YOUR profile.');
      }, 600);
    };
  }
  // Intercept ALL Share buttons (feed Share + ... menu Share)
  document.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(!btn) return;
    var txt = (btn.textContent||'').trim();
    if(txt==='Share' || txt.includes('🔗 Share')){
      // Only for feed post Share, not Create Post "Share in Jonotarium"
      if(txt.includes('Share in Jonotarium')) return;
      e.preventDefault(); e.stopPropagation();
      openShareModal(btn);
    }
  }, true);
})();
</script>

<script>
(function(){

        el.style.display='flex'; el.style.alignItems='center'; el.style.justifyContent='center';

        if(inner){ inner.style.margin='0 auto'; inner.style.maxWidth='420px'; inner.style.width='100%'; inner.style.transform='none'; }
      }
    });
    // Remove leaked instruction text nodes at top (Firestore Rules / firebaseConfig) if they ever appear as visible text
    try{
      var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      var toRemove=[]; var n;
      while(n=walker.nextNode()){
        if(n.nodeValue && (n.nodeValue.includes('Firestore Rules') || n.nodeValue.includes('Storage Rules') || n.nodeValue.includes('firebaseConfig') && n.nodeValue.includes('NOTE:'))){
          // Only remove if parent is NOT inside <script>/<style> and is direct body text
          var p=n.parentElement;
          if(p && p.tagName!=='SCRIPT' && p.tagName!=='STYLE' && p.tagName!=='CODE' && p.tagName!=='PRE'){
            toRemove.push(n);
          }
        }
      }
      toRemove.forEach(function(node){ if(node.parentElement) node.parentElement.removeChild(node); });
    }catch(e){}
  }
  setInterval(fixModals, 500);
})();

    // 3) inputs: when user pastes FB/YT link in Create Post, show instant preview + hide link on publish is handled by (1)(2)

  function saveProfile(p){
    try{ var cur={}; try{ cur=JSON.parse(localStorage.getItem("jonotarium_profile")||"{}"); }catch(e){} Object.assign(cur,p); localStorage.setItem("jonotarium_profile", JSON.stringify(cur)); }catch(e){}
  }
  // ---- Header: Post | yellow avatar + Name + pencil | Logout  (1 line each) ----
  function fixHeader(){
    var old=document.getElementById("jt-profile-bar"); if(old) old.remove();
    document.querySelectorAll("body *").forEach(function(el){
      if(el.children.length===0 && el.textContent && el.textContent.trim()==="Jonotarium Profile"){ el.remove(); }
    });
    var logoutBtn=null;
    document.querySelectorAll("button").forEach(function(b){ if((b.textContent||"").trim()==="Logout") logoutBtn=b; });
    if(!logoutBtn) return;
    var container=logoutBtn.parentElement; if(!container) return;
    container.style.whiteSpace="nowrap"; container.style.flexWrap="nowrap";
    var prof=getProfile();
    var chip=document.getElementById("jt-header-profile");
    if(chip && chip.parentElement===container){
      var ne=document.getElementById("jt-h-name-text"); if(ne) ne.textContent=prof.name||"Name";
      var av=document.getElementById("jt-h-avatar"); if(av){ if(prof.photo) av.innerHTML='<img src="'+prof.photo+'">'; else av.innerHTML='<span>'+((prof.name||"N").charAt(0).toUpperCase())+'</span>'; }
      return;
    }
    // Find old name span (Google User / Sayed) in same row
    var nameSpan=null;
    container.querySelectorAll("span").forEach(function(s){ if(!nameSpan && s.textContent && s.textContent.trim().length>0 && s.textContent.trim().length<40) nameSpan=s; });
    var displayName = prof.name || (nameSpan ? nameSpan.textContent.trim() : "") || "Name";
    if(displayName==="Google User" && prof.name) displayName=prof.name;
    if(displayName==="Sayed") displayName="Name";
    var chip2=document.createElement("span"); chip2.id="jt-header-profile";
    chip2.style.cssText="display:inline-flex;align-items:center;gap:8px;white-space:nowrap";
    chip2.innerHTML='<span class="jt-h-ava" style="position:relative;width:34px;height:34px;flex:0 0 34px;cursor:pointer"><span class="jt-h-img" id="jt-h-avatar" style="width:34px;height:34px;border-radius:50%;background:#FFD700;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden"></span><span style="position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:#FFD700;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px">✏️</span></span><span class="jt-h-name" style="font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;white-space:nowrap"><span id="jt-h-name-text"></span><span style="font-size:13px;cursor:pointer">✏️</span></span>';
    if(nameSpan){ container.insertBefore(chip2, nameSpan); nameSpan.style.display="none"; } else { container.insertBefore(chip2, logoutBtn); }
    document.getElementById("jt-h-name-text").textContent=displayName;
    var av2=document.getElementById("jt-h-avatar");
    if(prof.photo) av2.innerHTML='<img src="'+prof.photo+'" style="width:100%;height:100%;object-fit:cover">';
    else av2.innerHTML='<span>'+((displayName||"N").charAt(0).toUpperCase())+'</span>';
    chip2.querySelector(".jt-h-ava").onclick=function(){ pickPhoto(); };
    chip2.querySelector(".jt-h-name").onclick=function(){
      var m=document.getElementById("jt-profile-modal"); if(m){ m.style.display="flex"; return; }
      var nv=prompt("Enter your Name", displayName==="Name"?"":displayName);
      if(nv && nv.trim()){ saveProfile({name:nv.trim()}); }
    };
    // +Post button 1 line
    document.querySelectorAll("header button").forEach(function(b){
      if((b.textContent||"").replace(/\s+/g," ").trim()==="+ Post" || (b.textContent||"").indexOf("Post")>-1 && b.textContent.length<20){
        b.style.whiteSpace="nowrap"; b.style.flexShrink="0";
      }
    });
    // Logout not cut: allow header row scroll if needed
    var hdrRow=container.closest("div"); if(hdrRow){ hdrRow.style.overflowX="auto"; }
  }
  function pickPhoto(){
    var inp=document.getElementById("jt-profile-file-hidden");
    if(!inp){ inp=document.createElement("input"); inp.id="jt-profile-file-hidden"; inp.type="file"; inp.accept="image/*"; inp.style.display="none"; document.body.appendChild(inp);
      inp.addEventListener("change", function(){
        var f=inp.files && inp.files[0]; if(!f) return;
        var r=new FileReader();
        r.onload=function(){ var img=new Image(); img.onload=function(){ var max=600,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h)); var c=document.createElement("canvas"); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); var data=c.toDataURL("image/jpeg",0.82); saveProfile({photo:data}); alert("Photo saved successfully"); }; img.src=r.result; }; r.readAsDataURL(f);
      });
    }
    inp.click();
  }
  // ---- Facebook: 1 card only, NO double embed, NO Unavailable box ----
  function fixFB(){
    document.querySelectorAll("iframe").forEach(function(f){
      var s=f.src||"";
      if(s.indexOf("facebook.com/plugins")<0) return;
      var wrap=f.closest("div"); if(!wrap) return;
      if(wrap.querySelector(".jt-fb-card")){ f.style.display="none"; return; }
      // Get original FB link
      var href=""; try{ var m=s.match(/href=([^&]+)/); if(m) href=decodeURIComponent(m[1]); }catch(e){}
      if(!href) href="https://www.facebook.com";
      // Hide the failing iframe, show 1 clean card
      f.style.display="none";
      var card=document.createElement("div"); card.className="jt-fb-card";
      card.innerHTML='<p>Facebook Video</p><p style="color:#666;font-size:13px">Facebook does not allow its videos to play inside other sites.</p><a href="'+href+'" target="_blank" rel="noopener">Watch on Facebook</a>';
      wrap.appendChild(card);
    });
    // Hide any duplicate FB fallback boxes in same post
    document.querySelectorAll(".jt-fb-fallback").forEach(function(el, i){
      // keep only first per post container
      var parent=el.parentElement;
      if(parent && parent.querySelectorAll(".jt-fb-fallback").length>1 && i>0) el.style.display="none";
    });
  }
  // ---- YouTube Shorts: 9:16, no crop ----
  function fixYT(){
    document.querySelectorAll("iframe").forEach(function(f){
      var s=f.src||"";
      if(s.indexOf("youtube")<0 && s.indexOf("youtu")<0) return;
      var isShort = s.indexOf("/shorts/")>-1 || s.indexOf("shorts")>-1;
      var box=f.closest("div"); if(!box) return;
      if(isShort){
        box.classList.add("jt-shorts-box");
        box.style.maxWidth="340px"; box.style.margin="0 auto"; box.style.aspectRatio="9/16";
        f.style.width="100%"; f.style.height="100%"; f.style.objectFit="contain"; f.style.aspectRatio="9/16";
      } else {
        // normal YT: 16:9, not cropped
        f.style.objectFit="contain";
        if(box.style.aspectRatio==="9 / 16" || box.style.aspectRatio==="9/16"){ box.style.aspectRatio="16/9"; }
      }
    });
    document.querySelectorAll("video").forEach(function(v){ v.style.objectFit="contain"; });
  }
  // ---- Post author: Google User -> real Name + photo, persist ----
  function fixPosts(){
    var prof=getProfile();
    document.querySelectorAll("body *").forEach(function(el){
      if(el.children.length===0 && (el.textContent||"").trim()==="Google User"){
        if(prof.name) el.textContent=prof.name;
      }
    });
    // Avatar circles with G in post cards -> photo / initial
    document.querySelectorAll("div").forEach(function(el){
      if(el.children.length===0 && (el.textContent||"").trim()==="G"){
        // only if inside a post card (has Bangladesh nearby) - check parent
        var card=el.closest("div"); if(card && card.innerText && card.innerText.indexOf("Bangladesh")>-1){
          if(prof.photo){ el.innerHTML='<img src="'+prof.photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'; el.style.background="#FFD700"; }
          else if(prof.name){ el.textContent=prof.name.charAt(0).toUpperCase(); }
        }
      }
    });
    // Backup visible posts so they survive reload on this device
    try{
      var titles=[];
      document.querySelectorAll("body *").forEach(function(el){ if(el.children.length===0 && el.textContent && el.textContent.trim().length>5 && el.textContent.trim().length<120) titles.push(el.textContent.trim()); });
      if(titles.length>0) localStorage.setItem("jonotarium_posts_backup", JSON.stringify(titles.slice(0,30)));
    }catch(e){}
  }
  // ---- Persistence: on login, restore profile from localStorage (don't wipe) ----
  function restoreProfile(){
    try{
      var p=JSON.parse(localStorage.getItem("jonotarium_profile")||"{}");
      var u=JSON.parse(localStorage.getItem("jonotarium_user")||"null");
      if(u && !p.name && u.name && u.name!=="Google User"){ saveProfile({name:u.name}); }
      if(u && !p.photo && u.photo){ saveProfile({photo:u.photo}); }
      // If user is Google User but we have saved profile, keep saved profile (don't overwrite with Google User)
      if(u && u.name==="Google User" && p.name){ /* keep p */ }
    }catch(e){}
  }
  function run(){ fixHeader(); fixFB(); fixYT(); fixPosts(); restoreProfile(); }
  setInterval(run, 900);
  document.addEventListener("DOMContentLoaded", run);
  run();
})();
</script>

<script>
(function(){
  function titleCase(n){
    if(!n) return n;
    return n.split(' ').map(function(w){
      if(!w) return w;
      // Already capital thakle thak, lowercase thakle capital koro: sayed -> Sayed, abu -> Abu
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  window.__jtTitleCase = titleCase;
  function fixStep1(){
    // Header row ke nowrap
    var rows = document.querySelectorAll('header > div');
    rows.forEach(function(r){
      if(r.innerText && r.innerText.indexOf('Post')>-1 && r.innerText.indexOf('Logout')>-1 || r.innerText && r.innerText.indexOf('+ Post')>-1){
        r.style.display='flex'; r.style.flexWrap='nowrap'; r.style.alignItems='center'; r.style.gap='8px'; r.style.overflowX='auto'; r.style.whiteSpace='nowrap';
      }
    });
    // +Post button
    document.querySelectorAll('header button').forEach(function(b){
      var t = (b.textContent||'').replace(/\s+/g,' ').trim();
      if(t.indexOf('+ Post')>-1 || t==='Post' || t.indexOf('Post')>-1 && t.length<15){
        b.style.whiteSpace='nowrap'; b.style.flexShrink='0'; b.style.minWidth='max-content';
      }
      if(t==='Logout'){ b.style.whiteSpace='nowrap'; b.style.flexShrink='0'; }
    });
    // Name 1 line + Title Case: Abu sayed -> Abu Sayed
    var ne = document.getElementById('jt-h-name-text');
    if(ne && ne.textContent){
      var fixed = titleCase(ne.textContent.trim());
      if(fixed !== ne.textContent) ne.textContent = fixed;
      ne.style.whiteSpace='nowrap'; ne.style.overflow='hidden'; ne.style.textOverflow='ellipsis'; ne.style.maxWidth='120px'; ne.style.display='inline-block';
    }
    // Real header (v10) name-o Title Case
    var rh = document.querySelector('#jt-real-header');
    if(rh){
      rh.style.whiteSpace='nowrap';
      rh.querySelectorAll('span').forEach(function(s){
        var txt = (s.textContent||'').trim();
        if(txt && txt.length>1 && txt.length<40 && txt!=='✏️' && !s.querySelector('img')){
          // Name span - jodi 2 shobdo hoy
          if(txt.indexOf(' ') > -1){ var f = titleCase(txt); if(f!==txt) s.textContent = f; }
        }
      });
    }
    // Google User lekha thakle - profile name diye bodlano (v7-er sathe)
    // Post card-eo Google User thakle profile name
  }
  setInterval(fixStep1, 800);
  document.addEventListener('DOMContentLoaded', fixStep1);
  fixStep1();
})();
</script>

<!-- ===== POST PERSIST FIX (ei file-e): Firestore theke load, localStorage-e backup ===== -->
<script>
(function(){
  function tryLoadFirestore(){
    try{
      if(!window.firebase || !window.firebase.firestore) return;
      var db = window.firebase.firestore();
      db.collection("posts").orderBy("createdAt","desc").limit(50).get().then(function(snap){
        if(snap.empty) return;
        var arr=[]; snap.forEach(function(d){ var o=d.data(); o.id=d.id; arr.push(o); });
        var cur=[]; try{ cur=JSON.parse(localStorage.getItem("jonotarium_posts")||"[]"); }catch(e){}
        var ids={}; cur.forEach(function(o){ ids[o.id]=1; });
        var added=false;
        arr.forEach(function(o){ if(!ids[o.id]){ cur.unshift(o); added=true; } });
        if(added){ localStorage.setItem("jonotarium_posts", JSON.stringify(cur.slice(0,100))); }
        var emptyMsg = document.body.innerText && document.body.innerText.indexOf("এখনো কোনো পোস্ট নেই")>-1;
        if(emptyMsg && cur.length>0 && !sessionStorage.getItem("jt_reloaded_once")){
          sessionStorage.setItem("jt_reloaded_once","1");
          location.reload();
        }
      }).catch(function(){});
    }catch(e){}
  }
  document.addEventListener("DOMContentLoaded", function(){ setTimeout(tryLoadFirestore, 800); setTimeout(tryLoadFirestore, 3000); });
  setTimeout(tryLoadFirestore, 2000);
})();
</script>
